<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Steve</title>
  <style>
    :root {
      --bg: #f5f7f8;
      --panel: #fff;
      --line: #dbe3e7;
      --soft-line: #edf1f3;
      --text: #152024;
      --muted: #66747a;
      --accent: #0f766e;
      --accent-dark: #0a5e58;
      --warn: #a15c07;
      --danger: #982f2f;
      --ok: #12805c;
      --blue: #2764c5;
      --purple: #7c3aed;
      --shadow: 0 18px 45px rgba(32, 45, 52, .07);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    button, select, input { font: inherit; }
    button, select, input {
      height: 38px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--text);
      padding: 0 12px;
    }
    button { cursor: pointer; }
    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    button.primary:hover { background: var(--accent-dark); }
    button:disabled { opacity: .55; cursor: wait; }
    .page {
      width: min(1480px, calc(100vw - 40px));
      margin: 0 auto;
      padding: 22px 0 44px;
    }
    .top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 18px;
    }
    h1 {
      margin: 0;
      font-size: 28px;
      letter-spacing: 0;
      line-height: 1.15;
    }
    .lead {
      max-width: 800px;
      margin: 8px 0 0;
      line-height: 1.55;
      color: var(--muted);
    }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
    .secondary-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      margin-top: 8px;
    }
    .ghost-link {
      border: 0;
      height: auto;
      padding: 0;
      background: transparent;
      color: var(--muted);
      text-decoration: underline;
      text-underline-offset: 3px;
    }
    .target {
      display: grid;
      grid-template-columns: 220px 260px minmax(0, 1fr);
      gap: 12px;
      align-items: center;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 14px;
    }
    .target p { margin: 0; color: var(--muted); line-height: 1.45; }
    .health {
      grid-column: 1 / -1;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 14px;
    }
    .summary {
      display: grid;
      grid-template-columns: minmax(0, 1.2fr) minmax(280px, .8fr);
      gap: 14px;
      margin-bottom: 14px;
    }
    .flow-board {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      padding: 0;
      margin-bottom: 14px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .flow-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
      margin-bottom: 16px;
    }
    .flow-head h2 { margin: 0 0 5px; }
    .flow-head p { margin: 0; }
    .pulse-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--ok);
      box-shadow: 0 0 0 4px rgba(18, 128, 92, .12);
      margin-right: 7px;
      vertical-align: 1px;
    }
    .flow-status-line {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
      margin-top: 9px;
    }
    .flow-grid {
      display: grid;
      grid-template-columns: 220px minmax(0, 1fr) 240px;
      gap: 12px;
      align-items: stretch;
    }
    .flow-node {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fbfcfb;
      padding: 13px;
      min-width: 0;
    }
    .flow-node.active { border-color: #94c9b2; background: #f0fbf5; }
    .flow-node.done { border-color: #b8d9cc; background: #f7fcfa; }
    .flow-node.warn { border-color: #f2c56f; background: #fff9ed; }
    .flow-node.danger { border-color: #e9abab; background: #fff4f4; }
    .flow-node-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 7px;
      font-weight: 700;
    }
    .flow-node small {
      display: block;
      color: var(--muted);
      line-height: 1.45;
      font-size: 12px;
    }
    .flow-arrow {
      color: var(--muted);
      font-size: 12px;
      margin: 8px 0;
    }
    .agent-list {
      display: grid;
      gap: 8px;
    }
    .agent-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px;
      background: #fff;
    }
    .agent-row h3 {
      margin: 0 0 5px;
      font-size: 13px;
      line-height: 1.3;
    }
    .agent-row p {
      margin: 0;
      font-size: 12px;
      line-height: 1.45;
    }
    .agent-row .agent-meta {
      grid-column: 1 / -1;
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }
    .flow-lanes {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-top: 14px;
    }
    .lane {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      background: #fbfcfb;
      min-height: 150px;
    }
    .lane.active { background: #f3fbf7; border-color: #b8d9cc; }
    .lane.qa { background: #f8f6ff; border-color: #d8cdfa; }
    .lane.merge { background: #f1fbf7; border-color: #b8d9cc; }
    .lane.next { background: #fff9ed; border-color: #f1d28c; }
    .lane h3 {
      margin: 0 0 8px;
      font-size: 13px;
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: center;
    }
    .lane-item {
      font-size: 12px;
      color: #445149;
      line-height: 1.4;
      padding: 9px;
      border: 1px solid var(--soft-line);
      border-radius: 8px;
      background: rgba(255,255,255,.72);
      margin-top: 7px;
    }
    .lane-item strong {
      display: block;
      color: var(--text);
      font-size: 12.5px;
      margin-bottom: 4px;
    }
    .lane-item .mini {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
      margin-top: 7px;
    }
    .mini-pill {
      display: inline-flex;
      align-items: center;
      height: 20px;
      padding: 0 7px;
      border-radius: 999px;
      background: #edf2ed;
      color: #4b5a50;
      font-size: 11px;
    }
    .mini-pill.good { background: #e4f4ee; color: var(--ok); }
    .mini-pill.warn { background: #fff1d6; color: var(--warn); }
    .mini-pill.blue { background: #e8f0ff; color: var(--blue); }
    .fleet-hero {
      display: grid;
      grid-template-columns: minmax(0, .88fr) minmax(420px, 1.12fr);
      gap: 18px;
      padding: 22px;
      background:
        radial-gradient(circle at 15% 20%, rgba(39, 100, 197, .16), transparent 32%),
        radial-gradient(circle at 85% 5%, rgba(124, 58, 237, .14), transparent 30%),
        linear-gradient(135deg, #102027, #172532 52%, #0f1d24);
      border-bottom: 1px solid var(--line);
    }
    .fleet-radar h2,
    .mission-copy h2 {
      margin: 6px 0 8px;
      font-size: 30px;
      line-height: 1.2;
      color: #f6fbfb;
    }
    .fleet-radar p,
    .mission-copy p {
      max-width: 860px;
      color: #b7c8ce;
    }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #8ef0dc;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .04em;
      text-transform: uppercase;
    }
    .mission-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 14px;
    }
    .fleet-metrics {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 9px;
      margin-top: 18px;
    }
    .fleet-metrics span {
      min-height: 74px;
      border: 1px solid rgba(255,255,255,.13);
      border-radius: 8px;
      padding: 12px;
      background: rgba(255,255,255,.06);
      color: #b9c9cf;
      font-size: 12px;
      text-transform: uppercase;
    }
    .fleet-metrics b {
      display: block;
      color: #fff;
      font-size: 28px;
      line-height: 1;
      margin-bottom: 8px;
    }
    .command-deck {
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 8px;
      background: rgba(255,255,255,.08);
      padding: 16px;
      backdrop-filter: blur(16px);
    }
    .deck-head {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      margin-bottom: 10px;
      color: #fff;
    }
    .command-deck textarea {
      width: 100%;
      min-height: 112px;
      resize: vertical;
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 8px;
      background: rgba(8, 18, 24, .72);
      color: #f7fbfb;
      padding: 12px;
      line-height: 1.55;
      outline: none;
    }
    .command-deck textarea::placeholder { color: #91a6ae; }
    .operator-strip {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-bottom: 10px;
    }
    .operator-strip span {
      display: inline-flex;
      align-items: center;
      height: 24px;
      padding: 0 8px;
      border-radius: 999px;
      background: rgba(142, 240, 220, .12);
      color: #d4f8f1;
      border: 1px solid rgba(142, 240, 220, .18);
      font-size: 12px;
    }
    .directive-chips,
    .deck-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 10px;
    }
    .chip {
      height: 28px;
      border-radius: 999px;
      border-color: rgba(255,255,255,.15);
      background: rgba(255,255,255,.08);
      color: #d9e7eb;
      padding: 0 10px;
      font-size: 12px;
    }
    .chip:hover { background: rgba(255,255,255,.14); }
    .fleet-slots {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      padding: 16px 22px;
      background: #f8fbfc;
      border-bottom: 1px solid var(--line);
    }
    .worker-slot {
      display: grid;
      grid-template-columns: 52px minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      min-height: 92px;
      border: 1px solid #cfdfe4;
      border-radius: 8px;
      background: #fff;
      padding: 12px;
    }
    .worker-slot.idle {
      border-style: dashed;
      background: #f7fbf9;
    }
    .worker-slot.warn { border-color: #f1d28c; background: #fffaf0; }
    .worker-slot.good { border-color: #b8d9cc; background: #f5fcf9; }
    .worker-slot.blue { border-color: #bdd1f3; background: #f5f8ff; }
    .slot-orb {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #102027;
      color: #8ef0dc;
      font-size: 11px;
      font-weight: 900;
      box-shadow: inset 0 0 0 5px rgba(142, 240, 220, .14);
    }
    .worker-slot.idle .slot-orb {
      background: #eaf2ef;
      color: #688078;
      box-shadow: none;
    }
    .worker-slot strong {
      display: block;
      font-size: 13px;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }
    .worker-slot p {
      margin: 3px 0 0;
      font-size: 12px;
      line-height: 1.35;
    }
    .slot-state {
      align-self: start;
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
    }
    .codex-console {
      border: 1px solid rgba(15, 118, 110, .2);
      border-radius: 8px;
      background: rgba(255,255,255,.82);
      padding: 16px;
      box-shadow: 0 12px 30px rgba(19, 44, 50, .08);
    }
    .console-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      color: #415056;
      font-size: 13px;
      font-weight: 700;
    }
    .console-count {
      font-size: 48px;
      line-height: 1;
      font-weight: 800;
      color: var(--accent-dark);
      margin: 18px 0 8px;
    }
    .console-steps {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 6px;
      margin-top: 14px;
    }
    .console-steps span {
      height: 28px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      background: #eef2f4;
      color: #738087;
      font-size: 12px;
      font-weight: 700;
    }
    .console-steps span.on {
      background: #e4f4ee;
      color: var(--accent-dark);
    }
    .console-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 12px;
    }
    .agent-map {
      display: grid;
      grid-template-columns: minmax(150px, 1fr) 28px minmax(150px, 1fr) 28px minmax(150px, 1fr) 28px minmax(150px, 1fr);
      gap: 0;
      align-items: center;
      padding: 18px 22px;
      border-bottom: 1px solid var(--line);
      background: #fbfcfd;
    }
    .map-step {
      min-height: 96px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      padding: 13px;
      position: relative;
    }
    .map-step.active { border-color: #94c9b2; background: #f3fbf7; }
    .map-step.done { border-color: #b8d9cc; background: #f7fcfa; }
    .map-step.warn { border-color: #f1d28c; background: #fff9ed; }
    .step-index {
      display: inline-flex;
      height: 22px;
      padding: 0 7px;
      align-items: center;
      border-radius: 999px;
      background: #eef2f4;
      color: #617078;
      font-size: 11px;
      font-weight: 800;
      margin-bottom: 9px;
    }
    .map-step strong {
      display: block;
      font-size: 14px;
      margin-bottom: 5px;
    }
    .map-step small {
      display: block;
      color: var(--muted);
      line-height: 1.4;
    }
    .map-connector {
      height: 2px;
      background: linear-gradient(90deg, #b8d9cc, #cbd6dc);
    }
    .control-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 360px;
      gap: 18px;
      padding: 20px 22px 22px;
    }
    .section-line {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }
    .section-line h3 {
      margin: 0 0 5px;
      font-size: 16px;
    }
    .section-line p {
      margin: 0;
      font-size: 13px;
      color: var(--muted);
    }
    .agent-cards {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }
    .agent-card {
      display: grid;
      grid-template-columns: 42px minmax(0, 1fr);
      gap: 11px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      padding: 12px;
      min-width: 0;
    }
    .agent-avatar {
      width: 42px;
      height: 42px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      background: #eef2f4;
      color: #53626a;
      font-weight: 800;
      font-size: 12px;
    }
    .agent-avatar.good { background: #e4f4ee; color: var(--ok); }
    .agent-avatar.warn { background: #fff1d6; color: var(--warn); }
    .agent-avatar.blue { background: #e8f0ff; color: var(--blue); }
    .agent-card-main { min-width: 0; }
    .agent-card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px;
    }
    .agent-card h3 {
      margin: 0;
      font-size: 14px;
      line-height: 1.3;
      overflow-wrap: anywhere;
    }
    .agent-card p {
      font-size: 12px;
      line-height: 1.45;
      margin-bottom: 9px;
    }
    .agent-card-meta {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
    }
    .agent-actions {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
      margin-top: 10px;
    }
    .control-btn {
      height: 30px;
      border-radius: 8px;
      padding: 0 10px;
      border: 1px solid #cfdbe0;
      background: #fff;
      color: #435057;
      font-size: 12px;
      font-weight: 700;
    }
    .control-btn.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .control-btn:hover {
      border-color: #9fb3bd;
      background: #f8fbfc;
    }
    .control-btn.primary:hover {
      background: var(--accent-dark);
      border-color: var(--accent-dark);
    }
    .ops-queue {
      border-left: 1px solid var(--line);
      padding-left: 18px;
    }
    .queue-block {
      border: 1px solid var(--soft-line);
      border-radius: 8px;
      background: #fbfcfd;
      padding: 10px;
      margin-bottom: 10px;
    }
    .queue-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 12px;
      font-weight: 800;
      color: #405059;
      margin-bottom: 8px;
    }
    .queue-title span {
      color: var(--accent-dark);
    }
    .queue-item {
      display: grid;
      grid-template-columns: 9px minmax(0, 1fr) auto;
      gap: 8px;
      align-items: start;
      padding: 8px 0;
      border-top: 1px solid var(--soft-line);
    }
    .queue-item:first-of-type { border-top: 0; }
    .queue-item strong {
      display: block;
      font-size: 12px;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }
    .queue-item small {
      display: block;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.35;
      margin-top: 2px;
    }
    .queue-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #a9b4ba;
      margin-top: 5px;
    }
    .queue-dot.good { background: var(--ok); }
    .queue-dot.warn { background: #c77b10; }
    .queue-dot.blue { background: var(--blue); }
    .queue-empty {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
      padding: 6px 0 2px;
    }
    .empty.compact {
      padding: 20px;
      grid-column: 1 / -1;
    }
    .summary-card {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      padding: 16px;
    }
    .summary-card h2 {
      margin: 0 0 8px;
      font-size: 18px;
    }
    .summary-card strong { color: var(--text); }
    .insights {
      display: grid;
      gap: 8px;
      margin-top: 10px;
    }
    .insight {
      border-left: 3px solid var(--accent);
      padding-left: 10px;
      color: #445149;
      line-height: 1.45;
      font-size: 13px;
    }
    .stat {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      padding: 14px;
    }
    .stat b { display: block; font-size: 24px; margin-bottom: 7px; }
    .stat span { color: var(--muted); font-size: 13px; }
    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 410px;
      gap: 14px;
      align-items: start;
    }
    .toolbar {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }
    .toolbar input { flex: 1; min-width: 0; }
    .items { display: grid; gap: 12px; }
    .item, .panel {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      padding: 15px;
    }
    .item-head {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
    }
    h2 {
      margin: 0 0 8px;
      font-size: 17px;
      letter-spacing: 0;
    }
    .badges { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
    .badge {
      display: inline-flex;
      align-items: center;
      height: 24px;
      padding: 0 8px;
      border-radius: 999px;
      background: #edf2ed;
      color: #435047;
      font-size: 12px;
      white-space: nowrap;
    }
    .badge.good { background: #e4f4ee; color: #0d6047; }
    .badge.warn { background: #fff1d6; color: var(--warn); }
    .badge.danger { background: #fbe7e7; color: var(--danger); }
    .badge.blue { background: #e8f0ff; color: var(--blue); }
    .score {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      display: grid;
      place-content: center;
      background: #effaf5;
      border: 1px solid #b8d9cc;
      color: var(--accent-dark);
      font-weight: 700;
      text-align: center;
    }
    .score span { display: block; font-size: 11px; color: var(--muted); font-weight: 500; }
    p { margin: 0 0 8px; color: var(--muted); line-height: 1.55; }
    .path {
      margin: 10px 0;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fbfcfb;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12px;
      overflow-wrap: anywhere;
      color: #38443c;
    }
    .checks { display: grid; gap: 6px; margin: 10px 0; }
    .run-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 10px 0;
    }
    .check {
      display: grid;
      grid-template-columns: 16px minmax(0, 1fr);
      gap: 8px;
      font-size: 13px;
      color: #445149;
      line-height: 1.45;
    }
    .check::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      margin-top: 6px;
    }
    .item-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    .item-actions.collapsed { display: none; }
    .side { display: grid; gap: 12px; position: sticky; top: 16px; }
    .details-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 18px 0 10px;
      color: var(--muted);
      font-size: 13px;
    }
    pre {
      margin: 0;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      color: #354239;
      font-size: 12px;
      line-height: 1.5;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    .empty {
      border: 1px dashed var(--line);
      border-radius: 8px;
      padding: 26px;
      text-align: center;
      color: var(--muted);
      background: rgba(255,255,255,.62);
    }
    .toast {
      position: fixed;
      right: 18px;
      bottom: 18px;
      display: none;
      max-width: min(420px, calc(100vw - 36px));
      background: #15211a;
      color: #fff;
      border-radius: 8px;
      padding: 12px 14px;
    }
    .toast.show { display: block; }
    @media (max-width: 980px) {
      .page { width: min(100vw - 24px, 860px); }
      .top, .target { display: grid; }
      .target {
        grid-template-columns: 1fr;
      }
      .target select,
      .target input,
      .target button {
        width: 100%;
        min-width: 0;
      }
      .actions { justify-content: flex-start; }
      .secondary-actions { justify-content: flex-start; }
      .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .summary { grid-template-columns: 1fr; }
      .fleet-hero,
      .control-grid { grid-template-columns: 1fr; }
      .fleet-metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .fleet-slots { grid-template-columns: 1fr; }
      .agent-map {
        grid-template-columns: 1fr;
        gap: 8px;
      }
      .map-connector {
        width: 2px;
        height: 16px;
        margin-left: 22px;
      }
      .agent-cards { grid-template-columns: 1fr; }
      .ops-queue {
        border-left: 0;
        padding-left: 0;
      }
      .flow-grid { grid-template-columns: 1fr; }
      .flow-lanes { grid-template-columns: 1fr; }
      .layout { grid-template-columns: 1fr; }
      .side { position: static; }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="top">
      <div>
        <h1>Steve 工作指挥中心</h1>
        <p class="lead">看谁在工作、正在做什么、总质检怎么判、下一批准备派生什么。细节和文件证据放在下方详情里。</p>
      </div>
      <div class="actions">
        <button class="primary" id="auto">让 Steve 继续工作</button>
        <div class="secondary-actions">
          <button class="ghost-link" id="refresh">刷新</button>
          <button class="ghost-link" id="toggle-advanced">高级操作</button>
          <button class="ghost-link advanced-only" id="create" hidden>只生成计划</button>
          <button class="ghost-link advanced-only" id="merge" hidden>合并计划</button>
        </div>
      </div>
    </section>

    <section class="target">
      <select id="target"></select>
      <select id="run"></select>
      <p id="target-info">选择目标项目</p>
      <div class="health" id="target-health"></div>
    </section>

    <section class="flow-board" id="flow"></section>

    <section class="stats" id="stats"></section>

    <section class="summary" id="summary"></section>

    <section class="layout">
      <div>
        <div class="details-title">
          <span>任务详情</span>
          <span>默认隐藏已替代任务，打开高级操作可查看全部</span>
        </div>
        <div class="toolbar" id="toolbar" hidden>
          <input id="search" placeholder="搜索候选点、agent、skill 或建议动作" />
        </div>
        <div class="items" id="items"></div>
      </div>
      <aside class="side">
        <section class="panel">
          <h2>中文报告</h2>
          <pre id="report">暂无报告</pre>
        </section>
        <section class="panel">
          <h2>合并计划</h2>
          <pre id="plan">暂无合并计划</pre>
        </section>
      </aside>
    </section>
  </main>
  <div class="toast" id="toast"></div>
  <script src="/app.js"></script>
</body>
</html>
